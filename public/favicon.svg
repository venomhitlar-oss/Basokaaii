<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3"/>

  <!-- AI Basoka Emblem - Lightning Neural Core -->
  <g filter="url(#glow)">
    <!-- Central Lightning Spark (Basoka = Fast Lightning/Storm in Kurdish) -->
    <path d="M 285 70 L 165 260 L 260 260 L 225 442 L 355 240 L 255 240 Z" 
          fill="url(#cyan-glow)" 
          stroke="#e0f2fe" 
          stroke-width="8" 
          stroke-linejoin="round" />
  </g>

  <!-- Subtle Kurdish / Arabic Calligraphic Accent Curve -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 12" stroke-opacity="0.3"/>
  <circle cx="285" cy="70" r="10" fill="#38bdf8"/>
  <circle cx="225" cy="442" r="10" fill="#06b6d4"/>

  <!-- Basoka AI Lettering -->
  <text x="256" y="482" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#e0f2fe" 
        text-anchor="middle">
    BASOKA AI
  </text>
</svg>
