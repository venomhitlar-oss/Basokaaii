name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || true

      - name: Prepare APK Outputs
        run: |
          mkdir -p apk-output
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Basoka-AI-debug.apk
            echo "Debug APK found and copied."
          fi
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/Basoka-AI-release.apk
            echo "Release unsigned APK found and copied."
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Basoka-AI-debug-apk
          path: apk-output/Basoka-AI-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Basoka-AI-release-apk
          path: apk-output/Basoka-AI-release.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: Basoka-AI-All-APKs
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: latest
          name: "Basoka AI Latest Android APK"
          body: "Direct APK download for Basoka AI. Click on Basoka-AI-debug.apk to download and install immediately on your Android phone."
          draft: false
          prerelease: false
          files: |
            apk-output/Basoka-AI-debug.apk
            apk-output/Basoka-AI-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
